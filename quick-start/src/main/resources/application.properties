spring.application.name=quick-start
spring.main.web-application-type=servlet

# 激活 secret profile，加载 application-secret.properties 中的密钥
# 该文件已加入 .gitignore，不会提交到 Git
spring.profiles.active=secret

spring.ai.deepseek.chat.options.model=deepseek-chat

# 对话 AI 系统提示词：已移至代码 SystemPrompts.java 管理（支持多行文本块，便于版本控制）
# 如需切换角色，修改 ChatService 构造器中引用的 SystemPrompts.XXX 常量即可

# 单词缓存目录（JSON 文件持久化，无需数据库/Redis）
word.cache-dir=${user.home}/.word-push/cache

# Server酱 微信推送 SendKey：已移至 application-secret.properties（避免提交到 Git 造成泄露）

# ===== MySQL 会话记忆（study_ai 库） =====
# study_ai 库已由你确认存在，无需手动建库
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/study-ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时自动建表（schema.sql 中的 CREATE TABLE IF NOT EXISTS，重复执行安全）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 会话记忆窗口：get() 返回最近多少条作为提示词上下文（全量历史仍落库）
# 情感助手场景用户常贴长段聊天记录、需多轮追问，窗口调大以保留更多上下文
chat.memory.window-size=40

# ===== 智谱 GLM-4V-Flash 图片识别 =====
# OpenAI 兼容端点（key 在 application-secret.properties 的 glm4v.api-key）
glm4v.base-url=https://open.bigmodel.cn/api/paas/v4
glm4v.model=glm-4v-flash
# 补全路径：智谱端点没有 /v1 段，必须覆盖 Spring AI 默认的 /v1/chat/completions
# 最终请求 = base-url + completions-path = /api/paas/v4/chat/completions
glm4v.completions-path=/chat/completions

# ===== 阿里云百炼（通义）Embedding =====
# 用于 RAG 向量化。key 在 application-secret.properties 的 dashscope.api-key
# base-url 已含 /compatible-mode/v1，故 embeddings-path 必须是 /embeddings（不能带 /v1）
dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope.embedding.model=text-embedding-v3
dashscope.embeddings-path=/embeddings

# RAG 向量库持久化快照（SimpleVectorStore 的 JSON 文件）
# 启动时自动加载；新增/删除文档后自动落盘，避免重启丢失与重复向量化
rag.store-file=${user.home}/.study-ai/vector-store.json

# ===== RAG 知识库（启动时自动加载 resources/knowledge 下的 md） =====
# 内容指纹不变则跳过向量化（秒启动、零 API 调用）；内容变化才清空重建
rag.knowledge.enabled=false
rag.knowledge.location=classpath*:knowledge/*.md
rag.knowledge.fingerprint-file=${user.home}/.study-ai/knowledge.fingerprint

# 文档分块参数（token 级，自动向标点/换行微调边界）中文建议 chunk.size 300~800
rag.chunk.size=500
rag.chunk.min-size-chars=100
rag.chunk.keep-separator=true

# ===== Redis（分布式会话锁） =====
# 注意：需先启动本机 Redis，否则 Redisson 连接失败会导致应用启动失败
spring.data.redis.host=localhost
spring.data.redis.port=6379
# ⚠️ 本机 Redis 未设密码，这里必须整行注释掉，不要写成 password=（空值）
# 空值会被 Spring 绑定成 ""（不是 null），Redisson 会拿它发 AUTH "" 导致
# ERR AUTH <password> called without any password configured → Unable to connect
#spring.data.redis.password=
spring.data.redis.database=0

# 会话锁：同一 chatId 串行处理。等待锁的最长时间（秒），超时返回"处理中"提示
# 不设置 leaseTime，交给 Redisson 看门狗自动续期（AI 响应可能长达数十秒）
chat.lock.wait-time=2

# ===== Agent 显式决策循环（/api/agent/chat） =====
# 单次请求内最多步数：每"模型思考 → 执行工具"算一步，用于防止模型反复调工具导致死循环
agent.max-steps=8

# Agent 的 RAG 检索参数（因绕过 advisor 链，需手动检索注入参考资料）
agent.rag.top-k=4
agent.rag.similarity-threshold=0.5

# 图片上传大小限制（聊天记录截图可能超 1MB 默认值）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.mcp.server.name= yu-image-search-mcp-server
spring.ai.mcp.server.version= 0.0.1
spring.ai.mcp.server.type= SYNC
spring.ai.mcp.server.stdio= true

logging.level.ai.chat.client.advisor.SimpleLoggerAdvisor=debug
